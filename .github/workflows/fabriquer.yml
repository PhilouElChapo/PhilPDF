# Fabrication automatique de PhilPDF pour Windows, dans le cloud GitHub.
# Rien a installer sur le PC : Python, Qt, PyMuPDF et Tesseract sont embarques dans le paquet.
# - A chaque envoi de code sur main : fabrication, auto-controle, puis publication dans
#   "Releases" sous le numero de version de app/config.py (VERSION). La version publiee est
#   mise a jour a chaque envoi ; changer VERSION cree une nouvelle version, que PhilPDF
#   detecte tout seul au demarrage pour se mettre a jour.
name: Fabriquer PhilPDF

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pyftpdlib wsgidav cheroot

      - name: Test du moteur
        run: python tests/test_moteur.py

      - name: Test de la session partagee
        run: python tests/test_session.py

      - name: Test des tampons et signatures synchronises
        run: python tests/test_bibliotheque.py

      - name: Test des traductions
        run: python tests/test_langues.py

      - name: Test des emplacements distants (FTP, WebDAV, Synology simule)
        run: python tests/test_distant.py

      - name: Tesseract (embarque dans le paquet)
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          $src = "C:\Program Files\Tesseract-OCR"
          New-Item -ItemType Directory -Force tesseract | Out-Null
          Copy-Item "$src\*" tesseract -Recurse -Force
          Remove-Item tesseract\tessdata -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item tesseract\doc, tesseract\*.html, tesseract\unins* -Recurse -Force -ErrorAction SilentlyContinue

      - name: Version
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like "refs/tags/v*") { $env:GITHUB_REF_NAME.TrimStart("v") } else { (Select-String -Path app/config.py -Pattern 'VERSION = "(.+)"').Matches[0].Groups[1].Value }
          (Get-Content app/config.py) -replace 'VERSION = ".+"', "VERSION = `"$v`"" | Set-Content app/config.py
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: PhilPDF.exe
        run: >
          pyinstaller --noconfirm --clean --windowed --name PhilPDF --icon philpdf.ico
          --add-data "fonts;fonts" --add-data "langues;langues" --add-data "tessdata;tessdata" --add-data "tesseract;tesseract"
          --hidden-import moteur.modifier --hidden-import moteur.scan --hidden-import moteur.objets
          --hidden-import moteur.scanner --hidden-import win32com.client --collect-submodules pdf2docx
          --collect-submodules keyring --hidden-import win32ctypes.core
          --exclude-module scipy --exclude-module onnxruntime --exclude-module pymupdf_layout
          --exclude-module pymupdf4llm --exclude-module matplotlib --exclude-module pandas --exclude-module tkinter
          philpdf.py

      - name: Auto-controle du paquet (moteur + OCR embarque)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\PhilPDF\PhilPDF.exe -ArgumentList "--verifier", "$PWD\verif.txt" -Wait -PassThru
          Get-Content verif.txt
          if ($p.ExitCode -ne 0) { throw "auto-controle en echec" }

      - name: Version portable
        shell: pwsh
        run: |
          Copy-Item LISEZMOI.txt dist\PhilPDF\
          Set-Content dist\PhilPDF\portable.txt "PhilPDF portable : parametres et session ranges dans le dossier donnees"
          Compress-Archive -Force -Path dist\PhilPDF\* -DestinationPath PhilPDF_portable.zip
          Remove-Item dist\PhilPDF\portable.txt

      - name: Installateur
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DVersion=$env:VERSION installateur.iss
          Move-Item Output\PhilPDF_Setup.exe .

      - uses: actions/upload-artifact@v5
        with:
          name: PhilPDF-${{ env.VERSION }}-windows
          path: |
            PhilPDF_portable.zip
            PhilPDF_Setup.exe

      - name: Publication de la version
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: PhilPDF ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            PhilPDF ${{ env.VERSION }} pour Windows, tout en un (rien a installer a cote).
            - PhilPDF_portable.zip : a decompresser, aucune trace sur le PC.
            - PhilPDF_Setup.exe : installation sans droits administrateur.
          files: |
            PhilPDF_portable.zip
            PhilPDF_Setup.exe
