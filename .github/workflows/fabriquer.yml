# Fabrication automatique de PhilPDF pour Windows, dans le cloud GitHub.
# Rien a installer sur le PC : Python, Qt, PyMuPDF et Tesseract sont embarques dans le paquet.
# - A chaque envoi de code sur main : fabrication, auto-controle, puis publication dans
#   "Releases" sous le numero de version de app/config.py (VERSION). La version publiee est
#   mise a jour a chaque envoi ; changer VERSION cree une nouvelle version, que PhilPDF
#   detecte tout seul au demarrage pour se mettre a jour.
name: Fabriquer PhilPDF

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pyftpdlib wsgidav cheroot

      - name: Compression JBIG2 (petite bibliotheque C)
        run: python outils_dev/compiler_jbig2.py

      - name: Test du moteur
        run: python tests/test_moteur.py

      - name: Test de la session partagee
        run: python tests/test_session.py

      - name: Test des tampons et signatures synchronises
        run: python tests/test_bibliotheque.py

      - name: Test des traductions
        run: python tests/test_langues.py

      - name: Test des emplacements distants (FTP, WebDAV, Synology simule)
        run: python tests/test_distant.py

      - name: Test de Google Drive (Google simule)
        run: python tests/test_gdrive.py

      - name: Tests OneDrive, Dropbox, Box
        run: python tests/test_nuages.py

      - name: Test de l'assistant IA (Claude et Gemini simules)
        run: python tests/test_ia.py

      - name: Test des preferences (export, import)
        run: python tests/test_reglages.py
      - name: Signature numerique
        run: python tests/test_signature.py
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Formulaires
        run: python tests/test_formulaire.py
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Mesure
        run: python tests/test_mesure.py
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Tableaux vers Excel
        run: python tests/test_excel.py
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Alleger (JBIG2)
        run: python tests/test_alleger.py
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Traitement par lot et PDF/A
        run: python tests/test_lot.py
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Fractionner, parapher, signets, cote a cote
        run: python tests/test_organiser.py
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Envoi par e-mail
        run: python tests/test_courriel.py
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Tesseract (embarque dans le paquet)
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          $src = "C:\Program Files\Tesseract-OCR"
          New-Item -ItemType Directory -Force tesseract | Out-Null
          Copy-Item "$src\*" tesseract -Recurse -Force
          Remove-Item tesseract\tessdata -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item tesseract\doc, tesseract\*.html, tesseract\unins* -Recurse -Force -ErrorAction SilentlyContinue

      - name: Version
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like "refs/tags/v*") { $env:GITHUB_REF_NAME.TrimStart("v") } else { (Select-String -Path app/config.py -Pattern 'VERSION = "(.+)"').Matches[0].Groups[1].Value }
          (Get-Content app/config.py) -replace 'VERSION = ".+"', "VERSION = `"$v`"" | Set-Content app/config.py
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Identifiants des Drives (secrets du depot, jamais dans le code public)
        shell: python
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET || vars.GOOGLE_CLIENT_SECRET }}
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID || vars.ONEDRIVE_CLIENT_ID }}
          DROPBOX_CLIENT_ID: ${{ secrets.DROPBOX_CLIENT_ID || vars.DROPBOX_CLIENT_ID }}
          BOX_CLIENT_ID: ${{ secrets.BOX_CLIENT_ID || vars.BOX_CLIENT_ID }}
          BOX_CLIENT_SECRET: ${{ secrets.BOX_CLIENT_SECRET || vars.BOX_CLIENT_SECRET }}
        run: |
          import os, hashlib
          ids = {}
          for cle, env in (("gdrive", "GOOGLE"), ("onedrive", "ONEDRIVE"), ("dropbox", "DROPBOX"), ("box", "BOX")):
              brut_i, brut_s = os.environ.get(env + "_CLIENT_ID", ""), os.environ.get(env + "_CLIENT_SECRET", "")
              i = "".join(brut_i.split())          # espaces / retours a la ligne colles par erreur
              if brut_i != i or brut_s != brut_s.strip():
                  print("::warning title=Identifiants::" + cle + " : espaces ou retour a la ligne retires du secret du depot")
              os.environ[env + "_CLIENT_SECRET"] = "".join(brut_s.split())
              if i:
                  ids[cle] = {"id": i, "secret": os.environ.get(env + "_CLIENT_SECRET", "") or None}
              print(cle, ":", "identifiant present" if i else "secret " + env + "_CLIENT_ID absent")
              sec = os.environ.get(env + "_CLIENT_SECRET", "")
              print(("::notice title=Identifiants::" if i else "::warning title=Identifiants::") + cle + " : " +
                    ("identifiant present (" + str(len(i)) + " caracteres, se termine par " + i[-27:] + ")" if i else
                     "secret " + env + "_CLIENT_ID absent ou vide") +
                    (" ; secret present (" + str(len(sec)) + " caracteres, commence par " + sec[:6] + ", empreinte " +
                     hashlib.sha256(sec.encode()).hexdigest()[:10] + ")" if sec else
                     (" ; pas de secret" if cle in ("gdrive", "box") else "")))
          with open("app/identifiants.py", "w") as f:
              f.write("IDENTIFIANTS = " + repr(ids) + "\n")

      - name: PhilPDF.exe
        run: >
          pyinstaller --noconfirm --clean --windowed --name PhilPDF --icon philpdf.ico
          --add-data "fonts;fonts" --add-data "langues;langues" --add-data "tessdata;tessdata" --add-data "tesseract;tesseract"
          --hidden-import moteur.modifier --hidden-import moteur.scan --hidden-import moteur.objets
          --hidden-import moteur.scanner --hidden-import moteur.comparer --hidden-import moteur.traduire --hidden-import moteur.formulaire --hidden-import moteur.index --hidden-import app.ia --hidden-import app.dialogues_ia --hidden-import app.recherche --hidden-import app.apprentissage --hidden-import app.bienvenue --hidden-import app.synchro_choix --hidden-import app.alleger --hidden-import app.polices --hidden-import app.orthographe --hidden-import app.agenda --hidden-import app.avatars --hidden-import app.synchro_plan --hidden-import moteur.metadonnees --hidden-import moteur.retouche --hidden-import app.dialogues_retouche_ia --hidden-import app.styles_ia --hidden-import moteur.signature_num --hidden-import app.identites --hidden-import app.identites_systeme --hidden-import app.dialogues_signature --hidden-import app.signature_doc --hidden-import moteur.champs --hidden-import moteur.increment --hidden-import app.dialogues_champ --hidden-import app.formulaire_doc --hidden-import moteur.mesure --hidden-import moteur.tableaux --hidden-import moteur.jbig2 --hidden-import app.mesure_doc --hidden-import app.dialogues_mesure --hidden-import app.dialogues_excel --hidden-import app.lot --hidden-import app.reseau --collect-submodules truststore --hidden-import app.archiver --hidden-import moteur.pdfa --hidden-import moteur.apparence --add-binary "moteur/jbig2/philpdf_jbig2.dll;moteur/jbig2" --collect-submodules openpyxl --collect-submodules fontTools --collect-submodules pyhanko --collect-submodules pyhanko_certvalidator --collect-data pyhanko --collect-submodules asn1crypto --collect-submodules oscrypto --collect-submodules tzlocal --hidden-import PySide6.QtNetwork --collect-data spellchecker --hidden-import sqlite3 --hidden-import win32com.client --collect-submodules pdf2docx
          --collect-submodules keyring --hidden-import win32ctypes.core --hidden-import app.identifiants --hidden-import app.commentaires_doc --hidden-import app.creer --hidden-import app.imprimante --hidden-import moteur.office --hidden-import pythoncom --hidden-import app.signets_doc --hidden-import app.cote_a_cote --hidden-import app.dialogues_organiser --hidden-import app.ia_texte --hidden-import moteur.fractionner --hidden-import moteur.paraphe --hidden-import app.courriel --hidden-import app.dialogues_courriel --hidden-import app.ecran --hidden-import app.choix_dossier --hidden-import smtplib --hidden-import imaplib
          --exclude-module scipy --exclude-module onnxruntime --exclude-module pymupdf_layout
          --exclude-module pymupdf4llm --exclude-module matplotlib --exclude-module pandas --exclude-module tkinter
          philpdf.py

      - name: Auto-controle du paquet (moteur + OCR embarque)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\PhilPDF\PhilPDF.exe -ArgumentList "--verifier", "$PWD\verif.txt" -Wait -PassThru
          Get-Content verif.txt
          Get-Content verif.txt | Where-Object { $_ -match "^(google drive|onedrive|dropbox|box|coffre|ocr|langues|moteur|orthographe|RESULTAT)" } | ForEach-Object { Write-Output "::notice title=Auto-controle::$_" }
          if ($p.ExitCode -ne 0) { throw "auto-controle en echec" }

      - name: Version portable
        shell: pwsh
        run: |
          Copy-Item LISEZMOI.txt, LICENSE dist\PhilPDF\
          Set-Content dist\PhilPDF\portable.txt "PhilPDF portable : parametres et session ranges dans le dossier donnees"
          Compress-Archive -Force -Path dist\PhilPDF\* -DestinationPath PhilPDF_portable.zip
          Remove-Item dist\PhilPDF\portable.txt

      - name: Installateur
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DVersion=$env:VERSION installateur.iss
          Move-Item Output\PhilPDF_Setup.exe .

      - uses: actions/upload-artifact@v5
        with:
          name: PhilPDF-${{ env.VERSION }}-windows
          path: |
            PhilPDF_portable.zip
            PhilPDF_Setup.exe

      - name: Publication de la version
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: PhilPDF ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            PhilPDF ${{ env.VERSION }} pour Windows, tout en un (rien a installer a cote).
            - PhilPDF_portable.zip : a decompresser, aucune trace sur le PC.
            - PhilPDF_Setup.exe : installation sans droits administrateur.

            PhilPDF pour Linux (Zorin OS, Ubuntu, Fedora, Linux Mint...) :
            - PhilPDF.flatpak : double-clic (ou `flatpak install --user PhilPDF.flatpak`), tout est dedans, OCR compris.
            - PhilPDF_linux_x86_64.tar.gz : version a decompresser, sans installation (OCR : paquet tesseract-ocr du systeme).
          files: |
            PhilPDF_portable.zip
            PhilPDF_Setup.exe

  # ---------------------------------------------------------------- Linux
  linux:
    runs-on: ubuntu-22.04            # glibc 2.35 : l'archive marche sur Ubuntu 22.04+, Zorin 17+, Fedora 36+
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Bibliotheques du systeme (Qt, OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-image0 libxcb-render-util0 libegl1 libgl1 libdbus-1-3 \
            fontconfig tesseract-ocr
      - name: Dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pyftpdlib wsgidav cheroot
      - name: Compression JBIG2
        run: python outils_dev/compiler_jbig2.py
      - name: Tous les tests sous Linux
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          echec=0
          for t in tests/test_*.py; do
            echo "::group::$t"
            timeout 600 python "$t" > sortie.txt 2>&1; r=$?
            cat sortie.txt
            echo "::endgroup::"
            if [ $r -ne 0 ]; then
              echec=1
              echo "::error title=Test Linux en echec::$t (code $r)"
              grep -v "^OK" sortie.txt | tail -n 8 | cut -c1-200 | while IFS= read -r l; do echo "::warning title=$t::$l"; done
              msg=$(grep -v "^OK" sortie.txt | tail -n 25 | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
              echo "::error title=$t::$msg"
            fi
          done
          exit $echec
      - name: Version et identifiants
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET || vars.GOOGLE_CLIENT_SECRET }}
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID || vars.ONEDRIVE_CLIENT_ID }}
          DROPBOX_CLIENT_ID: ${{ secrets.DROPBOX_CLIENT_ID || vars.DROPBOX_CLIENT_ID }}
          BOX_CLIENT_ID: ${{ secrets.BOX_CLIENT_ID || vars.BOX_CLIENT_ID }}
          BOX_CLIENT_SECRET: ${{ secrets.BOX_CLIENT_SECRET || vars.BOX_CLIENT_SECRET }}
        run: |
          python outils_dev/identifiants_ci.py
          echo "VERSION=$(grep -oP 'VERSION = "\K[^"]+' app/config.py)" >> "$GITHUB_ENV"
      - name: PhilPDF (archive Linux)
        run: >
          pyinstaller --noconfirm --clean --windowed --name PhilPDF
          --add-data "fonts:fonts" --add-data "langues:langues" --add-data "tessdata:tessdata"
          --add-binary "moteur/jbig2/libphilpdf_jbig2.so:moteur/jbig2"
          --collect-submodules app --collect-submodules moteur
          --collect-submodules truststore --collect-submodules openpyxl --collect-submodules fontTools
          --collect-submodules pyhanko --collect-submodules pyhanko_certvalidator --collect-data pyhanko
          --collect-submodules asn1crypto --collect-submodules oscrypto --collect-submodules tzlocal
          --collect-submodules keyring --collect-submodules pdf2docx --collect-data spellchecker
          --hidden-import PySide6.QtNetwork --hidden-import sqlite3 --hidden-import smtplib --hidden-import imaplib
          --exclude-module scipy --exclude-module onnxruntime --exclude-module pymupdf_layout
          --exclude-module pymupdf4llm --exclude-module matplotlib --exclude-module pandas --exclude-module tkinter
          philpdf.py
      - name: Auto-controle du paquet
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          dist/PhilPDF/PhilPDF --verifier "$PWD/verif.txt"; r=$?
          cat verif.txt
          grep -E "^(ocr|moteur|langues|RESULTAT)" verif.txt | sed 's/^/::notice title=Linux::/'
          exit $r
      - name: Archive
        run: |
          cp LISEZMOI.txt LICENSE linux/philpdf-256.png dist/PhilPDF/
          tar czf PhilPDF_linux_x86_64.tar.gz -C dist PhilPDF
      - uses: actions/upload-artifact@v5
        with:
          name: linux-archive
          path: PhilPDF_linux_x86_64.tar.gz

  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v5
      - name: Version et identifiants
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET || vars.GOOGLE_CLIENT_SECRET }}
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID || vars.ONEDRIVE_CLIENT_ID }}
          DROPBOX_CLIENT_ID: ${{ secrets.DROPBOX_CLIENT_ID || vars.DROPBOX_CLIENT_ID }}
          BOX_CLIENT_ID: ${{ secrets.BOX_CLIENT_ID || vars.BOX_CLIENT_ID }}
          BOX_CLIENT_SECRET: ${{ secrets.BOX_CLIENT_SECRET || vars.BOX_CLIENT_SECRET }}
        run: |
          command -v python3 || dnf install -y python3
          python3 outils_dev/identifiants_ci.py
      - name: Fabrication du Flatpak
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          if ! flatpak-builder --user --install-deps-from=flathub --force-clean --repo=repo --disable-rofiles-fuse \
              build-flatpak linux/io.github.PhilouElChapo.PhilPDF.yml > fb.log 2>&1; then
            tail -n 150 fb.log
            msg=$(tail -n 40 fb.log | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Flatpak::$msg"
            exit 1
          fi
          tail -n 20 fb.log
      - name: Auto-controle dans le Flatpak
        shell: bash
        run: |
          set +e
          [ -s /etc/machine-id ] || (dbus-uuidgen 2>/dev/null || cat /proc/sys/kernel/random/uuid | tr -d -) > /etc/machine-id
          flatpak --user remote-add --if-not-exists --no-gpg-verify essai repo
          flatpak --user install -y --noninteractive essai io.github.PhilouElChapo.PhilPDF > /dev/null 2>&1 || echo "installation locale impossible"
          flatpak run --command=sh io.github.PhilouElChapo.PhilPDF -c '
            export QT_QPA_PLATFORM=offscreen; for d in /app/lib/python3*/site-packages; do export PYTHONPATH=$d; done
            python3 /app/philpdf/philpdf.py --verifier /tmp/verif.txt; r=$?
            cat /tmp/verif.txt
            echo "--- bibliotheques manquantes pour Qt (X11 / Wayland) :"
            for f in $(find /app/lib -path "*PySide6/Qt/plugins/platforms/*.so"); do ldd "$f" | grep "not found" && echo "  dans $f"; done
            echo "--- fin"
            exit $r' > verif.log 2>&1; r=$?
          cat verif.log
          msg=$(cut -c1-300 verif.log | grep -v "^\[INFO\]" | tail -n 40 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          if [ $r -ne 0 ]; then echo "::error title=Flatpak auto-controle::$msg"; exit 1; fi
          echo "::notice title=Flatpak auto-controle::$msg"
      - name: Paquet .flatpak
        run: |
          flatpak build-bundle repo PhilPDF.flatpak io.github.PhilouElChapo.PhilPDF \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo
          ls -la PhilPDF.flatpak
      - uses: actions/upload-artifact@v5
        with:
          name: linux-flatpak
          path: PhilPDF.flatpak

  publier-linux:
    needs: [windows, linux, flatpak]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Version
        run: |
          v=$(grep -oP 'VERSION = "\K[^"]+' app/config.py)
          case "$GITHUB_REF" in refs/tags/v*) v="${GITHUB_REF_NAME#v}";; esac
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v5
        with:
          pattern: linux-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: |
            PhilPDF.flatpak
            PhilPDF_linux_x86_64.tar.gz
