# Fabrication automatique de PhilPDF pour Windows, dans le cloud GitHub.
# Rien a installer sur le PC : Python, Qt, PyMuPDF et Tesseract sont embarques dans le paquet.
# - A chaque envoi de code sur main : fabrication, auto-controle, puis publication dans
#   "Releases" sous le numero de version de app/config.py (VERSION). La version publiee est
#   mise a jour a chaque envoi ; changer VERSION cree une nouvelle version, que PhilPDF
#   detecte tout seul au demarrage pour se mettre a jour.
name: Fabriquer PhilPDF

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pyftpdlib wsgidav cheroot

      - name: Test du moteur
        run: python tests/test_moteur.py

      - name: Test de la session partagee
        run: python tests/test_session.py

      - name: Test des tampons et signatures synchronises
        run: python tests/test_bibliotheque.py

      - name: Test des traductions
        run: python tests/test_langues.py

      - name: Test des emplacements distants (FTP, WebDAV, Synology simule)
        run: python tests/test_distant.py

      - name: Test de Google Drive (Google simule)
        run: python tests/test_gdrive.py

      - name: Tests OneDrive, Dropbox, Box
        run: python tests/test_nuages.py

      - name: Test de l'assistant IA (Claude et Gemini simules)
        run: python tests/test_ia.py

      - name: Test des preferences (export, import)
        run: python tests/test_reglages.py
      - name: Signature numerique
        run: python tests/test_signature.py
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Formulaires
        run: python tests/test_formulaire.py
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Tesseract (embarque dans le paquet)
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          $src = "C:\Program Files\Tesseract-OCR"
          New-Item -ItemType Directory -Force tesseract | Out-Null
          Copy-Item "$src\*" tesseract -Recurse -Force
          Remove-Item tesseract\tessdata -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item tesseract\doc, tesseract\*.html, tesseract\unins* -Recurse -Force -ErrorAction SilentlyContinue

      - name: Version
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like "refs/tags/v*") { $env:GITHUB_REF_NAME.TrimStart("v") } else { (Select-String -Path app/config.py -Pattern 'VERSION = "(.+)"').Matches[0].Groups[1].Value }
          (Get-Content app/config.py) -replace 'VERSION = ".+"', "VERSION = `"$v`"" | Set-Content app/config.py
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Identifiants des Drives (secrets du depot, jamais dans le code public)
        shell: python
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET || vars.GOOGLE_CLIENT_SECRET }}
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID || vars.ONEDRIVE_CLIENT_ID }}
          DROPBOX_CLIENT_ID: ${{ secrets.DROPBOX_CLIENT_ID || vars.DROPBOX_CLIENT_ID }}
          BOX_CLIENT_ID: ${{ secrets.BOX_CLIENT_ID || vars.BOX_CLIENT_ID }}
          BOX_CLIENT_SECRET: ${{ secrets.BOX_CLIENT_SECRET || vars.BOX_CLIENT_SECRET }}
        run: |
          import os, hashlib
          ids = {}
          for cle, env in (("gdrive", "GOOGLE"), ("onedrive", "ONEDRIVE"), ("dropbox", "DROPBOX"), ("box", "BOX")):
              brut_i, brut_s = os.environ.get(env + "_CLIENT_ID", ""), os.environ.get(env + "_CLIENT_SECRET", "")
              i = "".join(brut_i.split())          # espaces / retours a la ligne colles par erreur
              if brut_i != i or brut_s != brut_s.strip():
                  print("::warning title=Identifiants::" + cle + " : espaces ou retour a la ligne retires du secret du depot")
              os.environ[env + "_CLIENT_SECRET"] = "".join(brut_s.split())
              if i:
                  ids[cle] = {"id": i, "secret": os.environ.get(env + "_CLIENT_SECRET", "") or None}
              print(cle, ":", "identifiant present" if i else "secret " + env + "_CLIENT_ID absent")
              sec = os.environ.get(env + "_CLIENT_SECRET", "")
              print(("::notice title=Identifiants::" if i else "::warning title=Identifiants::") + cle + " : " +
                    ("identifiant present (" + str(len(i)) + " caracteres, se termine par " + i[-27:] + ")" if i else
                     "secret " + env + "_CLIENT_ID absent ou vide") +
                    (" ; secret present (" + str(len(sec)) + " caracteres, commence par " + sec[:6] + ", empreinte " +
                     hashlib.sha256(sec.encode()).hexdigest()[:10] + ")" if sec else
                     (" ; pas de secret" if cle in ("gdrive", "box") else "")))
          with open("app/identifiants.py", "w") as f:
              f.write("IDENTIFIANTS = " + repr(ids) + "\n")

      - name: PhilPDF.exe
        run: >
          pyinstaller --noconfirm --clean --windowed --name PhilPDF --icon philpdf.ico
          --add-data "fonts;fonts" --add-data "langues;langues" --add-data "tessdata;tessdata" --add-data "tesseract;tesseract"
          --hidden-import moteur.modifier --hidden-import moteur.scan --hidden-import moteur.objets
          --hidden-import moteur.scanner --hidden-import moteur.comparer --hidden-import moteur.traduire --hidden-import moteur.formulaire --hidden-import moteur.index --hidden-import app.ia --hidden-import app.dialogues_ia --hidden-import app.recherche --hidden-import app.apprentissage --hidden-import app.bienvenue --hidden-import app.synchro_choix --hidden-import app.alleger --hidden-import app.polices --hidden-import app.orthographe --hidden-import app.agenda --hidden-import app.avatars --hidden-import app.synchro_plan --hidden-import moteur.metadonnees --hidden-import moteur.retouche --hidden-import app.dialogues_retouche_ia --hidden-import app.styles_ia --hidden-import moteur.signature_num --hidden-import app.identites --hidden-import app.dialogues_signature --hidden-import app.signature_doc --hidden-import moteur.champs --hidden-import app.dialogues_champ --hidden-import app.formulaire_doc --collect-submodules pyhanko --collect-submodules pyhanko_certvalidator --collect-data pyhanko --collect-submodules asn1crypto --collect-submodules oscrypto --collect-submodules tzlocal --hidden-import PySide6.QtNetwork --collect-data spellchecker --hidden-import sqlite3 --hidden-import win32com.client --collect-submodules pdf2docx
          --collect-submodules keyring --hidden-import win32ctypes.core --hidden-import app.identifiants
          --exclude-module scipy --exclude-module onnxruntime --exclude-module pymupdf_layout
          --exclude-module pymupdf4llm --exclude-module matplotlib --exclude-module pandas --exclude-module tkinter
          philpdf.py

      - name: Auto-controle du paquet (moteur + OCR embarque)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\PhilPDF\PhilPDF.exe -ArgumentList "--verifier", "$PWD\verif.txt" -Wait -PassThru
          Get-Content verif.txt
          Get-Content verif.txt | Where-Object { $_ -match "^(google drive|onedrive|dropbox|box|coffre|ocr|langues|moteur|orthographe|RESULTAT)" } | ForEach-Object { Write-Output "::notice title=Auto-controle::$_" }
          if ($p.ExitCode -ne 0) { throw "auto-controle en echec" }

      - name: Version portable
        shell: pwsh
        run: |
          Copy-Item LISEZMOI.txt dist\PhilPDF\
          Set-Content dist\PhilPDF\portable.txt "PhilPDF portable : parametres et session ranges dans le dossier donnees"
          Compress-Archive -Force -Path dist\PhilPDF\* -DestinationPath PhilPDF_portable.zip
          Remove-Item dist\PhilPDF\portable.txt

      - name: Installateur
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DVersion=$env:VERSION installateur.iss
          Move-Item Output\PhilPDF_Setup.exe .

      - uses: actions/upload-artifact@v5
        with:
          name: PhilPDF-${{ env.VERSION }}-windows
          path: |
            PhilPDF_portable.zip
            PhilPDF_Setup.exe

      - name: Publication de la version
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: PhilPDF ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            PhilPDF ${{ env.VERSION }} pour Windows, tout en un (rien a installer a cote).
            - PhilPDF_portable.zip : a decompresser, aucune trace sur le PC.
            - PhilPDF_Setup.exe : installation sans droits administrateur.
          files: |
            PhilPDF_portable.zip
            PhilPDF_Setup.exe
